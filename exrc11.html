<DOCTYPE! html>
<html>
<head>
<title>website</title>
<link rel="stylesheet" href="style3.css">
</head>
<body>
<h1 id="resultat">0</h1>
<button onclick="ajouter()" >+</button>
<button onclick="soustraire()">-</button>
<script>
    let compteur = 0 ;
    let boite = document.getElementById("resultat");
    function ajouter() {
         compteur++ ;
         boite.innerHTML =compteur;
         if (compteur > 10 ){
            boite.style.color = "red";
         }
         else if(compteur === 0 ){
            boite.style.color = "green";
         }
          
    }
    function soustraire(){
        compteur--;
        boite.innerHTML =compteur;
        if (compteur <= 10) {
            boite.style.color = "black";
        }
        else if(compteur === 0 ){
            boite.style.color = "green";
         }
    }
</script>
</body>
</html>
